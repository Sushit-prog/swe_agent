[project]
name = "swe-agent"
version = "0.1.0"
description = "CLI-first autonomous Software Engineering Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.40",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlmodel>=0.0.22",
    "PyGithub>=2",
    "pyyaml>=6",
]

[project.scripts]
swe = "swe_agent.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
